map $http_x_forwarded_proto $upstream_forwarded_proto {
 default $http_x_forwarded_proto;
 "" $scheme;
}

# Resolve service hostnames at request time via Docker DNS (127.0.0.11) so a
# recreated backend container with a new IP does not leave nginx pointing at a
# stale address. The $backend variable forces per-request resolution.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = / {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  try_files /index.html =404;
 }
 location = /index.html {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
 }
 location ~ ^/(services|booking|shop|cart|about|contact|order(?:/[^/]+)?|products/[^/]+)/?$ {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  try_files /index.html =404;
 }
 location / {
  try_files $uri $uri/ =404;
 }
 location /api/v1/public/ {
   # Variable host forces per-request DNS resolution (see `resolver` above). The
   # literal scheme is required so nginx forwards the full request URI.
   set $backend backend:8080;
   proxy_pass http://$backend;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Host $http_host;
   proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   }
  location ~ ^/(robots\.txt|sitemap\.xml)$ {
    set $backend backend:8080;
    proxy_pass http://$backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   }
 location /api/ {
  return 404;
 }
 location = /webhooks/stripe {
  # Variable host forces per-request DNS resolution (see `resolver` above). The
  # literal scheme is required so nginx forwards the full request URI.
  set $backend backend:8080;
  proxy_pass http://$backend;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location /assets/ { expires 1h; }
}
