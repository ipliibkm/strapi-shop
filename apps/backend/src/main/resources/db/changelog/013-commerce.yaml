databaseChangeLog:
  - changeSet:
      id: 013-commerce
      author: platform
      changes:
        - createTable:
            tableName: product
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true}}
              - column: {name: slug, type: varchar(200), constraints: {nullable: false, unique: true}}
              - column: {name: name, type: varchar(200), constraints: {nullable: false}}
              - column: {name: description, type: text, defaultValue: '', constraints: {nullable: false}}
              - column: {name: active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: timestamptz, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamptz, defaultValueComputed: now(), constraints: {nullable: false}}
        - createTable:
            tableName: product_variant
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true}}
              - column: {name: product_id, type: uuid, constraints: {nullable: false, references: product(id), foreignKeyName: fk_product_variant_product}}
              - column: {name: sku, type: varchar(100), constraints: {nullable: false, unique: true}}
              - column: {name: label, type: varchar(200)}
              - column: {name: price_cents, type: bigint, constraints: {nullable: false, checkConstraint: 'price_cents >= 0'}}
              - column: {name: currency, type: char(3), defaultValue: EUR, constraints: {nullable: false}}
              - column: {name: stock_quantity, type: integer, defaultValueNumeric: '0', constraints: {nullable: false, checkConstraint: 'stock_quantity >= 0'}}
              - column: {name: reserved_quantity, type: integer, defaultValueNumeric: '0', constraints: {nullable: false, checkConstraint: 'reserved_quantity >= 0'}}
              - column: {name: active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
        - createTable:
            tableName: shop_order
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true}}
              - column: {name: order_number, type: varchar(40), constraints: {nullable: false, unique: true}}
              - column: {name: status, type: varchar(24), defaultValue: PENDING_PAYMENT, constraints: {nullable: false, checkConstraint: "status in ('PENDING_PAYMENT','PAID','FULFILLED','CANCELLED')"}}
              - column: {name: customer_name, type: varchar(200), constraints: {nullable: false}}
              - column: {name: customer_email, type: varchar(254), constraints: {nullable: false}}
              - column: {name: street, type: varchar(200)}
              - column: {name: city, type: varchar(120)}
              - column: {name: postal_code, type: varchar(32)}
              - column: {name: country, type: char(2)}
              - column: {name: currency, type: char(3), defaultValue: EUR, constraints: {nullable: false}}
              - column: {name: subtotal_cents, type: bigint, constraints: {nullable: false, checkConstraint: 'subtotal_cents >= 0'}}
              - column: {name: tax_cents, type: bigint, constraints: {nullable: false, checkConstraint: 'tax_cents >= 0'}}
              - column: {name: shipping_cents, type: bigint, constraints: {nullable: false, checkConstraint: 'shipping_cents >= 0'}}
              - column: {name: total_cents, type: bigint, constraints: {nullable: false, checkConstraint: 'total_cents >= 0'}}
              - column: {name: stripe_session_id, type: varchar(120)}
              - column: {name: created_at, type: timestamptz, defaultValueComputed: now(), constraints: {nullable: false}}
        - createTable:
            tableName: shop_order_item
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true}}
              - column: {name: order_id, type: uuid, constraints: {nullable: false, references: shop_order(id), foreignKeyName: fk_shop_order_item_order}}
              - column: {name: variant_id, type: uuid}
              - column: {name: product_name, type: varchar(200), constraints: {nullable: false}}
              - column: {name: variant_label, type: varchar(200)}
              - column: {name: quantity, type: integer, constraints: {nullable: false, checkConstraint: 'quantity > 0'}}
              - column: {name: unit_price_cents, type: bigint, constraints: {nullable: false, checkConstraint: 'unit_price_cents >= 0'}}
              - column: {name: line_total_cents, type: bigint, constraints: {nullable: false, checkConstraint: 'line_total_cents >= 0'}}
              - column: {name: fulfilled_quantity, type: integer, defaultValueNumeric: '0', constraints: {nullable: false, checkConstraint: 'fulfilled_quantity >= 0'}}
              - column: {name: refunded_quantity, type: integer, defaultValueNumeric: '0', constraints: {nullable: false, checkConstraint: 'refunded_quantity >= 0'}}
        - createTable:
            tableName: payment
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true}}
              - column: {name: order_id, type: uuid, constraints: {nullable: false, unique: true, references: shop_order(id), foreignKeyName: fk_payment_order}}
              - column: {name: provider, type: varchar(32), defaultValue: stripe, constraints: {nullable: false}}
              - column: {name: external_id, type: varchar(120)}
              - column: {name: amount_cents, type: bigint, constraints: {nullable: false, checkConstraint: 'amount_cents >= 0'}}
              - column: {name: status, type: varchar(24), defaultValue: PENDING, constraints: {nullable: false, checkConstraint: "status in ('PENDING','SUCCEEDED','FAILED','PARTIALLY_REFUNDED','REFUNDED')"}}
        - createTable:
            tableName: shipment
            columns:
              - column: {name: order_id, type: uuid, constraints: {primaryKey: true, references: shop_order(id), foreignKeyName: fk_shipment_order}}
              - column: {name: carrier, type: varchar(120)}
              - column: {name: tracking_number, type: varchar(80)}
              - column: {name: status, type: varchar(24), defaultValue: PENDING, constraints: {nullable: false, checkConstraint: "status in ('PENDING','SHIPPED')"}}
              - column: {name: shipped_at, type: timestamptz}
        - createTable:
            tableName: commerce_settings
            columns:
              - column: {name: id, type: integer, defaultValueNumeric: '1', constraints: {primaryKey: true}}
              - column: {name: shop_enabled, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: tax_rate_bps, type: integer, defaultValueNumeric: '0', constraints: {nullable: false, checkConstraint: 'tax_rate_bps >= 0 and tax_rate_bps <= 35000'}}
              - column: {name: shipping_flat_cents, type: bigint, defaultValueNumeric: '0', constraints: {nullable: false, checkConstraint: 'shipping_flat_cents >= 0'}}
              - column: {name: free_shipping_threshold_cents, type: bigint}
              - column: {name: updated_at, type: timestamptz, defaultValueComputed: now(), constraints: {nullable: false}}
        - createTable:
            tableName: stripe_event
            columns:
              - column: {name: event_id, type: varchar(255), constraints: {primaryKey: true}}
              - column: {name: type, type: text, constraints: {nullable: false}}
              - column: {name: received_at, type: timestamptz, defaultValueComputed: now(), constraints: {nullable: false}}
        - insert:
            tableName: commerce_settings
            columns:
              - column: {name: id, valueNumeric: '1'}
              - column: {name: shop_enabled, valueBoolean: true}
              - column: {name: tax_rate_bps, valueNumeric: '0'}
              - column: {name: shipping_flat_cents, valueNumeric: '499'}
