databaseChangeLog:
  - changeSet:
      id: 022-commerce-order-expiry
      author: platform
      changes:
        - addColumn:
            tableName: shop_order
            columns:
              - column: {name: expires_at, type: timestamptz}
        - sql:
            sql: update shop_order set expires_at=created_at + interval '30 minutes' where status='PENDING_PAYMENT' and expires_at is null
        - createIndex:
            tableName: shop_order
            indexName: ix_shop_order_pending_expiry
            columns:
              - column: {name: status}
              - column: {name: expires_at}
