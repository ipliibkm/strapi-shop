databaseChangeLog:
  - changeSet:
      id: 009-persistent-admin-session
      author: platform
      changes:
        - createTable:
            tableName: spring_session
            columns:
              - column: {name: primary_id, type: char(36), constraints: {primaryKey: true, nullable: false}}
              - column: {name: session_id, type: char(36), constraints: {nullable: false}}
              - column: {name: creation_time, type: bigint, constraints: {nullable: false}}
              - column: {name: last_access_time, type: bigint, constraints: {nullable: false}}
              - column: {name: max_inactive_interval, type: integer, constraints: {nullable: false}}
              - column: {name: expiry_time, type: bigint, constraints: {nullable: false}}
              - column: {name: principal_name, type: varchar(100)}
        - addUniqueConstraint:
            tableName: spring_session
            columnNames: session_id
            constraintName: spring_session_ix1
        - createIndex:
            tableName: spring_session
            indexName: spring_session_ix2
            columns:
              - column: {name: expiry_time}
        - createIndex:
            tableName: spring_session
            indexName: spring_session_ix3
            columns:
              - column: {name: principal_name}
        - createTable:
            tableName: spring_session_attributes
            columns:
              - column: {name: session_primary_id, type: char(36), constraints: {nullable: false}}
              - column: {name: attribute_name, type: varchar(200), constraints: {nullable: false}}
              - column: {name: attribute_bytes, type: bytea, constraints: {nullable: false}}
        - addPrimaryKey:
            tableName: spring_session_attributes
            columnNames: session_primary_id,attribute_name
            constraintName: spring_session_attributes_pk
        - addForeignKeyConstraint:
            baseTableName: spring_session_attributes
            baseColumnNames: session_primary_id
            referencedTableName: spring_session
            referencedColumnNames: primary_id
            constraintName: spring_session_attributes_fk
            onDelete: CASCADE
