spring:
  application:
    name: ipli-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info

platform:
  auth:
    enabled: ${PLATFORM_AUTH_ENABLED:false}
    authority: ${PLATFORM_OIDC_ISSUER:}
    client-id: ${PLATFORM_OIDC_CLIENT_ID:}
    audience: ${PLATFORM_OIDC_AUDIENCE:}
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${PLATFORM_OIDC_ISSUER:}
