name: angular-build
on:
  push:
    paths: ['apps/admin/**','apps/setup/**','apps/storefront/**','packages/ui/**','package.json','package-lock.json','angular.json','tsconfig.json','.postcssrc.json','.github/workflows/frontend.yml']
  pull_request:
    paths: ['apps/admin/**','apps/setup/**','apps/storefront/**','packages/ui/**','package.json','package-lock.json','angular.json','tsconfig.json','.postcssrc.json','.github/workflows/frontend.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@10.9.4
      - run: npm ci --no-audit --no-fund
      - run: npm run format:frontend:check
      - run: npm run build:admin && npm run build:storefront && npm run build:setup
