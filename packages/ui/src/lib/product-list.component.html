@if (products().length) {
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
    @for (item of products(); track item.id) {
      <article
        class="product-list-card group relative flex flex-col rounded-3xl border theme-border bg-surface overflow-hidden transition-shadow hover:shadow-lg"
      >
        <button type="button" class="flex flex-col h-full text-left" (click)="open.emit(item)">
          <div class="relative aspect-square product-media">
            @if (item.url) {
              <img
                [src]="item.url"
                [alt]="item.name"
                class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
              />
            } @else {
              <span class="flex items-center justify-center text-6xl font-light">{{
                initialOf(item.name)
              }}</span>
            }
            @if (item.badge) {
              <span class="absolute top-3 left-3 badge-chip">{{ item.badge }}</span>
            }
          </div>
          <div class="flex flex-col grow p-5">
            <h3 class="text-lg font-semibold leading-snug">{{ item.name }}</h3>
            @if (item.description) {
              <p class="mt-1 text-sm text-slate-500 line-clamp-2 grow">{{ item.description }}</p>
            }
            <div class="mt-4 flex items-center justify-between">
              <span class="font-semibold">{{ item.priceLabel || '' }}</span>
              @if (labels().addToCart) {
                <button
                  type="button"
                  mat-icon-button
                  color="primary"
                  [attr.aria-label]="labels().addToCart + ': ' + item.name"
                  (click)="$event.stopPropagation(); addToCart.emit(item)"
                >
                  <mat-icon>shopping_bag</mat-icon>
                </button>
              } @else {
                <mat-icon class="text-slate-400 transition-transform group-hover:translate-x-1">
                  arrow_forward
                </mat-icon>
              }
            </div>
          </div>
        </button>
      </article>
    }
  </div>
} @else if (labels().empty) {
  <p class="muted center">{{ labels().empty }}</p>
}
