<section class="image-upload" [attr.aria-busy]="uploading()">
  <div class="image-upload-head">
    <div>
      <strong>{{ labels().title || 'Images' }}</strong>
      <small>{{ labels().help || 'Upload JPG, PNG, or WebP images.' }}</small>
    </div>
    <span>{{ images().length }}/{{ maxImages() }}</span>
  </div>

  @if (images().length) {
    <div class="image-grid">
      @for (image of images(); track image; let index = $index) {
        <figure>
          <img [src]="image" alt="" />
          @if (index === 0) {
            <span class="primary-badge">1</span>
          }
          <button
            type="button"
            [attr.aria-label]="(labels().remove || 'Remove image') + ' ' + (index + 1)"
            [disabled]="uploading()"
            (click)="removeImage.emit(index)"
          >
            <mat-icon>close</mat-icon>
          </button>
        </figure>
      }
    </div>
  }

  <input
    #fileInput
    class="visually-hidden"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    multiple
    (change)="onFiles($event)"
  />
  <button
    type="button"
    class="drop-zone"
    [disabled]="uploading() || remaining() === 0"
    (click)="openPicker()"
    (drop)="onDrop($event)"
    (dragover)="allowDrop($event)"
  >
    <mat-icon>{{ uploading() ? 'progress_activity' : 'add_photo_alternate' }}</mat-icon>
    <span>
      @if (uploading()) {
        {{ labels().uploading || 'Uploading images…' }}
      } @else if (remaining() === 0) {
        {{ labels().limitReached || 'Image limit reached.' }}
      } @else {
        {{ labels().choose || 'Choose images or drop them here' }}
      }
    </span>
  </button>
</section>
